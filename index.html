<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="今日やることに集中するための、シンプルなタスク管理アプリ。" />
    <title>FocusFlow — 今日に集中する</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="FocusFlow ホームへ戻る">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>FocusFlow</span>
        </a>
        <p class="date-label" id="todayLabel"></p>
      </header>

      <section class="hero" aria-labelledby="pageTitle">
        <div>
          <p class="eyebrow">YOUR DAILY SPACE</p>
          <h1 id="pageTitle">今日に集中する。</h1>
          <p class="hero-copy">小さく始めて、ひとつずつ前へ。</p>
        </div>
        <div class="progress-card" aria-label="今日の進捗">
          <div class="progress-heading">
            <span>今日の進捗</span>
            <strong id="progressPercent">0%</strong>
          </div>
          <div class="progress-track"><span id="progressBar"></span></div>
          <p id="progressMessage">まずはひとつ、完了させよう。</p>
        </div>
      </section>

      <section class="task-panel" aria-labelledby="taskHeading">
        <div class="panel-heading">
          <div>
            <h2 id="taskHeading">今日のタスク</h2>
            <p id="taskCount">0件のタスク</p>
          </div>
          <button class="clear-button" id="clearCompleted" type="button">完了済みを削除</button>
        </div>

        <form class="task-form" id="taskForm">
          <label class="sr-only" for="taskInput">新しいタスク</label>
          <input id="taskInput" name="task" type="text" maxlength="80" placeholder="新しいタスクを追加…" autocomplete="off" required />
          <button class="add-button" type="submit"><span aria-hidden="true">＋</span>追加</button>
        </form>

        <div class="filters" role="group" aria-label="タスクの表示を切り替え">
          <button class="filter-button is-active" data-filter="all" type="button">すべて</button>
          <button class="filter-button" data-filter="active" type="button">未完了</button>
          <button class="filter-button" data-filter="completed" type="button">完了済み</button>
        </div>

        <ul class="task-list" id="taskList" aria-live="polite"></ul>
        <div class="empty-state" id="emptyState" hidden>
          <span class="empty-icon" aria-hidden="true">☼</span>
          <p id="emptyTitle">タスクはありません</p>
          <span id="emptyHint">上のフォームから、最初の一歩を追加しましょう。</span>
        </div>
      </section>

      <footer class="footer-note"><span aria-hidden="true">⌘</span> Focus on what matters</footer>
    </main>
  </body>
</html>
