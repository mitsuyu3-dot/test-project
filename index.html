<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#42b6eb" />
    <meta name="description" content="仮想チップで遊ぶ無料バカラゲーム。" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <title>VELVET TABLE — 仮想チップ・バカラ</title>
    <link rel="stylesheet" href="style.css?v=mobile-layout-2" />
    <script type="module" src="app.js?v=mobile-layout-2"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="VELVET TABLE ホーム"><span class="brand-mark">♠</span><span><b>VELVET</b><small>TABLE</small></span></a>
        <div class="status-cluster"><div class="balance"><small>所持チップ</small><strong><span class="coin-icon">●</span><span id="balanceValue">1,000</span></strong></div><div class="round-status"><small>ラウンド</small><b id="roundStatus">01</b></div><button class="settings-button" id="settingsButton" type="button" aria-label="設定">⚙</button></div>
      </header>

      <div class="settings-modal" id="settingsModal" hidden role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="settings-backdrop" data-settings-close></div><div class="settings-panel"><button class="settings-close" type="button" data-settings-close aria-label="設定を閉じる">×</button><p class="eyebrow">GAME MENU</p><h2 id="settingsTitle">ゲーム設定</h2><p>仮想チップで遊ぶバカラです。カードの絞り操作と候補判定を楽しめます。</p></div></div>

      <section class="table-card" aria-label="バカラテーブル">
        <div class="table-head"><span class="round-label" id="roundLabel">ROUND 01</span><span class="shoe-label" id="phaseLabel">BETTING</span></div>
        <div class="hands">
          <article class="hand" id="playerHand"><div class="hand-title"><span>PLAYER</span><strong id="playerTotal">?</strong></div><div class="cards" id="playerCards"></div><div class="hand-actions"><button class="reveal-side-button" data-owner="PLAYER" type="button">開く</button><button class="squeeze-side-button" data-owner="PLAYER" data-direction="right" type="button">絞る ←</button><button class="squeeze-side-button" data-owner="PLAYER" data-direction="left" type="button">絞る →</button><button class="reveal-all-side-button" data-owner="PLAYER" type="button">全部開く</button></div></article>
          <div class="versus"><span>VS</span><small id="resultLabel">BET TO DEAL</small></div>
          <article class="hand" id="bankerHand"><div class="hand-title"><span>BANKER</span><strong id="bankerTotal">?</strong></div><div class="cards" id="bankerCards"></div><div class="hand-actions"><button class="reveal-side-button" data-owner="BANKER" type="button">開く</button><button class="squeeze-side-button" data-owner="BANKER" data-direction="right" type="button">絞る ←</button><button class="squeeze-side-button" data-owner="BANKER" data-direction="left" type="button">絞る →</button><button class="reveal-all-side-button" data-owner="BANKER" type="button">全部開く</button></div></article>
        </div>
        <div class="table-message" id="tableMessage">ベットを選んで、ラウンドを始めましょう</div><div class="result-details" id="resultDetails" hidden></div><button class="new-round-button" id="newRoundButton" type="button" hidden>次のゲームへ</button>
      </section>

      <section class="bet-panel" aria-label="ベット設定"><div class="section-heading"><div><p class="eyebrow">ベット</p><h2>どちらが勝つ？</h2></div><span class="bet-total">合計 <strong id="betValue">0</strong></span></div><div class="bet-targets" id="betTargets"><button class="target-button target-player" data-target="player" type="button"><span>PLAYER</span><small>1 : 1</small><b>青のチーム</b></button><button class="target-button target-tie" data-target="tie" type="button"><span>TIE</span><small>8 : 1</small><b>同点をねらう</b></button><button class="target-button target-banker" data-target="banker" type="button"><span>BANKER</span><small>0.95 : 1</small><b>赤のチーム</b></button></div><div class="side-bet-heading"><span>サイドベット</span></div><div class="side-bets" id="sideBets"><button class="side-bet-button side-cyan" data-sidebet="tie6" title="PLAYERとBANKERがともに6で引き分け"><span>TIE 6</span><small>35 : 1</small></button><button class="side-bet-button side-purple" data-sidebet="tigerPair" title="最初の2枚のペア。片側4倍、両側20倍、4枚同ランク100倍"><span>TIGER PAIR</span><small>4/20/100 : 1</small></button><button class="side-bet-button side-yellow" data-sidebet="small6" title="BANKERが最初の2枚で6を作って勝利"><span>SMALL 6</span><small>22 : 1</small></button><button class="side-bet-button side-blue" data-sidebet="big6" title="BANKERが3枚目に6を引いて勝利"><span>BIG 6</span><small>50 : 1</small></button><button class="side-bet-button side-green" data-sidebet="lucky6" title="BANKERの6勝利。2枚なら12倍、3枚なら20倍"><span>LUCKY 6</span><small>12/20 : 1</small></button></div><div class="chip-row" aria-label="チップ額"><button class="chip-button chip-10" data-amount="10" type="button">10</button><button class="chip-button chip-50" data-amount="50" type="button">50</button><button class="chip-button chip-100" data-amount="100" type="button">100</button><button class="chip-button chip-500" data-amount="500" type="button">500</button><button class="chip-button chip-1000" data-amount="1000" type="button">1000</button><button class="chip-button chip-clear" id="clearBet" type="button">CLEAR</button></div><button class="deal-button" id="dealButton" type="button" disabled><span>ゲーム開始</span><small>ベットを選択してください</small></button></section>

      <div class="squeeze-modal" id="squeezeModal" hidden aria-labelledby="squeezeModalTitle" aria-modal="true" role="dialog"><div class="squeeze-modal-backdrop" data-squeeze-close></div><div class="squeeze-modal-panel"><div class="squeeze-modal-header"><div><p class="eyebrow">SQUEEZE VIEW</p><h2 id="squeezeModalTitle">PLAYER · 1枚目</h2></div><span class="squeeze-progress-label" id="squeezeProgressLabel">0%</span></div><div class="squeeze-direction-picker" id="squeezeDirectionPicker" aria-label="絞り方向"><button type="button" data-squeeze-direction="bottom">↓ 下から</button><button type="button" data-squeeze-direction="left">← 左から</button><button type="button" data-squeeze-direction="right">→ 右から</button></div><p class="squeeze-modal-hint">カードの端から中央へドラッグ</p><div class="squeeze-modal-stage"><div class="squeeze-modal-card" id="squeezeModalCard" tabindex="0"></div><aside class="squeeze-candidates" id="squeezeCandidates" aria-live="polite"><span class="squeeze-candidates-label">現在の候補</span><strong id="squeezeCandidateValues">A, 2〜10, J, Q, K</strong><small id="squeezeCandidateStatus">公開情報を待機中</small></aside></div><div class="squeeze-modal-guide"><span>← 左右</span><span>↓ 下から</span></div><div class="squeeze-modal-actions"><button class="squeeze-close-button" id="squeezeCloseButton" type="button">いったん戻る</button><button class="squeeze-open-button" id="squeezeOpenButton" type="button">開く</button></div></div></div>
    </main>
  </body>
</html>
